name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.2)'
        required: false
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare Binaries (ffmpeg, ffprobe, yt-dlp)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bin"
          
          # 1. Download yt-dlp.exe
          Write-Host "Downloading yt-dlp.exe..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp.exe"
          
          # 2. Download genuine standalone ffmpeg & ffprobe binaries (avoiding chocolatey 392KB shims)
          Write-Host "Downloading ffmpeg essentials build..."
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted" -Force
          $realFfmpeg = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          Copy-Item $realFfmpeg.FullName "bin/ffmpeg.exe" -Force
          $realFfprobe = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
          Copy-Item $realFfprobe.FullName "bin/ffprobe.exe" -Force
          Remove-Item "ffmpeg.zip", "ffmpeg_extracted" -Recurse -Force

          Get-ChildItem -Path "bin" | Select-Object Name, Length

      - name: Publish GarminMusicStudio Standalone (.exe)
        shell: pwsh
        run: |
          dotnet publish GarminMusicStudio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o release_output

      - name: Package Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release_assets"
          
          # 1. Standalone single-file .exe
          Copy-Item "release_output/GarminMusicStudio.exe" "release_assets/GarminMusicStudio.exe"
          
          # 2. Individual helper binaries for direct download / auto-download
          Copy-Item "bin/yt-dlp.exe" "release_assets/yt-dlp.exe"
          Copy-Item "bin/ffmpeg.exe" "release_assets/ffmpeg.exe"
          Copy-Item "bin/ffprobe.exe" "release_assets/ffprobe.exe"
          
          # 3. Complete portable zip bundle (including bin/ dependencies: ffmpeg, ffprobe, yt-dlp, mtp_helper.ps1)
          New-Item -ItemType Directory -Force -Path "bundle/GarminMusicStudio/bin"
          Copy-Item "release_output/GarminMusicStudio.exe" "bundle/GarminMusicStudio/"
          Copy-Item "bin/*" "bundle/GarminMusicStudio/bin/" -Recurse -Force
          Compress-Archive -Path "bundle/GarminMusicStudio" -DestinationPath "release_assets/GarminMusicStudio-win-x64-bundle.zip"
          
          Get-ChildItem -Path "release_assets"

      - name: Determine Release Tag
        id: get_tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d') {
            $tag = "${{ github.event.inputs.version }}"
            if (-not $tag) { $tag = "v1.0.2" }
          }
          Write-Host "Release Tag: $tag"
          "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Garmin Music Studio ${{ env.TAG_NAME }}
          body: |
            ## Garmin Music Studio ${{ env.TAG_NAME }}
            
            ### 📦 下載與檔案說明 / Release Assets
            - **GarminMusicStudio-win-x64-bundle.zip (強烈推薦)**：完整免安裝便攜包，已預先包裝所有音訊轉換工具與組件（`bin/ffmpeg.exe`、`bin/yt-dlp.exe`、`bin/mtp_helper.ps1`），解壓縮後即可完整離線使用！
            - **GarminMusicStudio.exe**：單一獨立執行檔。若使用此單檔，程式在首次啟動時會**自動偵測並從官方來源自動補齊** `bin/` 目錄缺少的 `yt-dlp.exe` 與 `ffmpeg.exe`；您亦可直接下載下方提供的 `ffmpeg.exe` 與 `yt-dlp.exe` 放入同層的 `bin/` 目錄。
            - **ffmpeg.exe / yt-dlp.exe**：音訊轉檔與 YouTube 下載依賴組件。
            
            ### ✨ v1.0.1 新增與優化項目
            - **自動補齊 bin 目錄組件**：單檔 .exe 執行時若缺少 yt-dlp 或 ffmpeg，將自動在背景補齊下載，解決組件遺失問題。
            - **電腦音樂庫空目錄管理**：支援勾選空目錄進行批次刪除，並在每個目錄列新增「🗑 刪除目錄」快捷按鍵。
            - **手錶「手機撥放清單」目錄**：將手錶根目錄的 .m3u8 播放清單整合為「手機撥放清單」並預設置頂於第一位。
            - **播放清單「詳細資訊」彈窗**：點擊播放清單旁詳細資訊按鈕，即可檢視播放清單內所有歌曲與路徑。
            - **Podcast 與 YouTube 下載任務管理**：新增下載任務清單，支援即時取消、刪除任務與一鍵清空，且刪除任務保留實體檔案。
            - **目錄記憶與資料夾開啟**：記憶上次選取的下載目錄，並提供一鍵以檔案總管開啟電腦音樂庫功能。
            
            ### 🎵 主要核心功能
            - 支援 Garmin 手錶（Forerunner 255/265/965、Fēnix 系列等）MTP 隨插即連與同步
            - 智慧手錶目錄分類與雙向歌單維護
            - 繁體中文 / 萬國碼歌名亂碼自動修正
            - 建立相容 Garmin 手錶的 UTF-8 M3U8 播放清單
            - 內建 Subsonic WiFi 無線音訊伺服器
            - YouTube 與 Podcast 音樂快速下載與轉檔 (192kbps MP3)
            - 內建本機音訊試聽播放器
          draft: false
          prerelease: false
          files: |
            release_assets/GarminMusicStudio.exe
            release_assets/GarminMusicStudio-win-x64-bundle.zip
            release_assets/ffmpeg.exe
            release_assets/ffprobe.exe
            release_assets/yt-dlp.exe
